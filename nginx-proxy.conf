server {
    listen 80;
    server_name _; # Menerima semua request dari IP manapun

    # Match backend upload limit (MAX_UPLOAD_MB) with headroom for form overhead
    client_max_body_size 30M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve static frontend build jika ada, fallback ke dev server di host
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ @vite;
    }

    location @vite {
        proxy_pass http://host.docker.internal:5173; # maps to host via extra_hosts
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy ke Backend (FastAPI / SSE)
    # Disarankan diarahkan langsung ke service `api` di docker network
    location ~ ^/(auth|chat|projects|datasets|notebook|history|health|streamlit) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # Penting untuk Server-Sent Events (SSE) agar tidak di-buffer oleh Nginx
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
