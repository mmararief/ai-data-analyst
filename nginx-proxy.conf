server {
    listen 80;
    server_name _; # Menerima semua request dari IP manapun

    # Membatasi ukuran upload (jika ada upload dataset yang besar)
    client_max_body_size 500M;

    # Serve static frontend build jika ada, fallback ke dev server di host
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ @vite;
    }

    location @vite {
        proxy_pass http://host.docker.internal:5173; # maps to host via extra_hosts
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy ke Backend (FastAPI / SSE)
    # Disarankan diarahkan langsung ke service `api` di docker network
    location ~ ^/(auth|chat|projects|datasets|notebook|history|streamlit) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # Penting untuk Server-Sent Events (SSE) agar tidak di-buffer oleh Nginx
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
